[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gmgn-revival-radar"
version = "0.2.0"
description = "Small, read-only GMGN revival scanner with SQLite and Telegram alerts"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic-settings>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[project.scripts]
revival-radar = "revival_radar.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revival_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
