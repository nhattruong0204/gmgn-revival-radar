# Use with the scanner and website overlays in the existing Compose project.
services:
  caddy:
    image: caddy:2-alpine
    init: true
    network_mode: host
    environment:
      RADAR_DOMAIN: onchainflow.app
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
